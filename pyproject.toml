[project]
name = "protege"
version = "0.1.0"
description = "IronLabs platform CLI"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
protege = "protege.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protege"]
